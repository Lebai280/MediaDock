name: build

# 每次推 master 都跑一遍（单测 + 出签名包），打 tag 时额外发一个 Release。
# 这样「发版」不再是一串手工步骤：bump 版本 → push，包自己就出来了。
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # compileSdk 37.2 是 AGP 9 的「次版本平台」（目录名就是 android-37.2），
      # runner 上没预装，得自己装。build-tools 同理。
      - name: 装 SDK 平台与 build-tools
        run: |
          set -e
          SM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(command -v sdkmanager)"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-37.2" "platforms;android-36" "build-tools;37.0.0"

      # 签名密钥以 base64 存在仓库 secret 里。好处不只是省事 ——
      # 本机那份 keystore 丢掉就永久不能再更新这个 App，CI 里存一份算是异地冗余。
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          [ -n "$KEYSTORE_BASE64" ] || { echo "缺少 ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # 复用仓库里现有的读取方式：app/build.gradle.kts 从 local.properties 取这 4 个键
      - name: 写 local.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "mediadock.storeFile=$RUNNER_TEMP/release.jks"
            echo "mediadock.storePassword=$STORE_PASSWORD"
            echo "mediadock.keyAlias=$KEY_ALIAS"
            echo "mediadock.keyPassword=$KEY_PASSWORD"
          } > local.properties

      - name: 单测
        run: ./gradlew :app:testDebugUnitTest

      - name: 构建 release APK
        run: ./gradlew :app:assembleRelease

      - name: 收集产物
        run: |
          set -e
          mkdir -p out
          # 版本号从 build.gradle.kts 读，别在 CI 里再写一份
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          cp app/build/outputs/apk/release/app-release.apk "out/MediaDock-${VERSION}.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: MediaDock-${{ env.VERSION }}
          path: out/*.apk

      - name: 打 tag 时发 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release create "$GITHUB_REF_NAME" out/*.apk \
            --title "MediaDock $VERSION" --generate-notes
